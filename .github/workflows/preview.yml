# Plan morning-digest § 3 and § 4. Saves /digest/2026-10-28 as one HTML file and deploys it to
# GitHub Pages. The marker comes from the repo variable LANE_MARKER, so the preview is never
# committed (ADR 0003). Clean-up: delete the variable and run this again; the banner then
# reads "no marker set" on the same link.
name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - name: Save the digest page
        env:
          LANE_MARKER: ${{ vars.LANE_MARKER }}
          PORT: 8787
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8787/health > /dev/null && break; sleep 1; done
          mkdir -p site
          curl -fsS http://localhost:8787/digest/2026-10-28 -o site/index.html
          grep -c '<header>' site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
